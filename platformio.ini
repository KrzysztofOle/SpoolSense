[env:m5stack-core]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DNFC_INTERFACE_I2C
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    bogde/HX711
    https://github.com/Seeed-Studio/PN532.git
